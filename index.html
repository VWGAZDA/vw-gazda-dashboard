<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>GAZDA Katowice · Dashboard dzienny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1b2e; --card:#162032; --border:#1e3a5f; --accent:#00b0f0;
  --text:#cbd5e1; --dim:#4a6080; --good:#22c55e; --bad:#ef4444; --warn:#f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.45;min-height:100vh}
button{font-family:inherit}
h1,h2,h3{font-weight:700;color:#e8eef7}
.hidden{display:none!important}

/* ===== LOGIN ===== */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;padding:16px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:36px 32px;width:100%;max-width:380px;text-align:center}
.login-card .brand{font-size:11px;letter-spacing:.22em;color:var(--accent);font-weight:700;text-transform:uppercase}
.login-card h1{font-size:22px;margin:10px 0 2px}
.login-card .sub{color:var(--dim);font-size:12.5px;margin-bottom:24px}
.login-card input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:#0f1726;color:#e8eef7;font-size:15px;outline:none;text-align:center;letter-spacing:.12em}
.login-card input:focus{border-color:var(--accent)}
.login-card button{margin-top:14px;width:100%;padding:12px;border:none;border-radius:8px;background:var(--accent);color:#04121f;font-weight:700;font-size:14px;cursor:pointer}
.login-card button:hover{filter:brightness(1.1)}
#login-err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:16px}

/* ===== SPLASH ===== */
#splash{position:fixed;inset:0;background:rgba(9,16,28,.97);z-index:90;overflow-y:auto;padding:22px 14px 40px}
.splash-inner{max-width:860px;margin:0 auto}
.splash-inner h1{font-size:20px;margin-bottom:2px}
.splash-date{color:var(--dim);font-size:12.5px;margin-bottom:18px}
.splash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 14px 12px}
.stat .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:600}
.stat .val{font-size:26px;font-weight:800;color:#e8eef7;margin-top:2px}
.stat .val small{font-size:13px;color:var(--dim);font-weight:600}
.stat .note{font-size:11px;color:var(--dim);margin-top:1px}
.stat.hl .val{color:var(--accent)}
.leaders{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 16px}
.leader{background:linear-gradient(135deg,#12263f,#162032);border:1px solid var(--border);border-radius:10px;padding:14px}
.leader .who{font-size:16px;font-weight:700;color:#e8eef7;margin-top:2px}
.leader .res{color:var(--accent);font-weight:700;font-size:13px}
.kon-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px}
.kon-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:10px}
.kon{display:flex;align-items:flex-end;gap:2px;height:90px}
.kon .bar{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;position:relative}
.kon .bar.wknd{background:#25405f}
.kon .bar.zero{background:#1a2a42}
.kon-days{display:flex;gap:2px;margin-top:4px}
.kon-days span{flex:1;text-align:center;font-size:8.5px;color:var(--dim)}
.splash-btn{display:block;width:100%;max-width:340px;margin:8px auto 0;padding:14px;border:none;border-radius:10px;background:var(--accent);color:#04121f;font-weight:800;font-size:15px;cursor:pointer}
.splash-op{background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.splash-op .m{color:var(--dim);font-size:11.5px}
.info-line{color:var(--dim);font-size:12px;margin:8px 0 14px}

/* ===== PROGRESS ===== */
.pbar{background:#0f1726;border:1px solid var(--border);border-radius:99px;height:22px;overflow:hidden;position:relative}
.pbar .fill{height:100%;border-radius:99px;background:var(--warn);transition:width .6s ease;min-width:4px}
.pbar .fill.blue{background:var(--accent)}
.pbar .fill.good{background:var(--good)}
.pbar .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}

/* ===== APP ===== */
#app{max-width:1180px;margin:0 auto;padding:14px 12px 60px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:6px 2px 12px}
.top .brand{font-size:11px;letter-spacing:.2em;color:var(--accent);font-weight:800;text-transform:uppercase}
.top h1{font-size:19px}
.top .date{color:var(--dim);font-size:12px;margin-left:auto}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;border-bottom:1px solid var(--border);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;border:none;background:transparent;color:var(--dim);font-weight:600;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
nav.subtabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 4px;scrollbar-width:none}
nav.subtabs::-webkit-scrollbar{display:none}
.subtab{padding:6px 12px;border:1px solid var(--border);background:var(--card);color:var(--dim);font-weight:600;font-size:12px;cursor:pointer;border-radius:99px;white-space:nowrap}
.subtab.active{color:#04121f;background:var(--accent);border-color:var(--accent)}
.section{margin-top:12px}

/* ===== CARDS/TABLES ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#9fb3cc;margin-bottom:12px}
.card .desc{font-size:12px;color:var(--dim);margin:-6px 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}.leaders{grid-template-columns:1fr}}
.table-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:480px}
th{background:#101c30;color:var(--dim);text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;padding:9px 10px;text-align:left;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid #1a2c47;white-space:nowrap}
tr.sum td{font-weight:800;color:#e8eef7;background:#101c30}
tr.hl-green td{background:rgba(34,197,94,.09)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:700}
.badge.good{background:rgba(34,197,94,.15);color:var(--good)}
.badge.bad{background:rgba(239,68,68,.15);color:var(--bad)}
.badge.warn{background:rgba(245,158,11,.15);color:var(--warn)}
.badge.blue{background:rgba(0,176,240,.15);color:var(--accent)}
.badge.dim{background:#1a2a42;color:var(--dim)}
.minibar{display:inline-block;height:8px;border-radius:99px;background:var(--accent);vertical-align:middle;min-width:2px}
.minibar.good{background:var(--good)}
.minibar.warn{background:var(--warn)}
.minibar.bad{background:var(--bad)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#9fb3cc}
.banner{background:rgba(0,176,240,.08);border:1px solid rgba(0,176,240,.35);border-radius:10px;padding:14px 16px;font-size:13px;margin-bottom:14px}
.banner b{color:var(--accent)}
.empty{color:var(--dim);font-size:12.5px;padding:14px;text-align:center}
.kpi-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:#101c30;border:1px solid var(--border);border-radius:10px;padding:12px}
.tile .lbl{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.tile .val{font-size:22px;font-weight:800;color:#e8eef7}
.tile .val small{font-size:12px;color:var(--dim)}
.task-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.task-grid{grid-template-columns:1fr}}
.person-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid #1a2c47;font-size:12.5px}
.person-row:first-of-type{border-top:none}
.person-row .nm{flex:0 0 150px;overflow:hidden;text-overflow:ellipsis}
.person-row .bar-track{flex:1;height:8px;background:#0f1726;border-radius:99px;overflow:hidden}
.person-row .bar-fill{height:100%;background:var(--accent);border-radius:99px}
.person-row .sc{flex:0 0 44px;text-align:right;font-weight:700;color:#e8eef7;font-variant-numeric:tabular-nums}

/* ===== GRAFIK ===== */
.grafik-table td,.grafik-table th{padding:5px 4px;text-align:center;font-size:11px}
.grafik-table td:first-child,.grafik-table th:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600}
.grafik-table td.wknd,.grafik-table th.wknd{background:#101a2c;color:var(--dim)}
.grafik-table td.hol,.grafik-table th.hol{background:rgba(239,68,68,.12)}
.g-U{color:var(--warn);font-weight:800}
.g-Z{color:var(--bad);font-weight:800}
.g-S{color:var(--accent);font-weight:800}
.toggle{display:inline-flex;border:1px solid var(--border);border-radius:99px;overflow:hidden;margin-bottom:12px}
.toggle button{padding:6px 14px;border:none;background:transparent;color:var(--dim);font-weight:600;font-size:12px;cursor:pointer}
.toggle button.active{background:var(--accent);color:#04121f}
footer{color:var(--dim);font-size:11px;text-align:center;margin-top:30px}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="login-card">
    <div class="brand">Volkswagen · Gazda Katowice</div>
    <h1>Dashboard dzienny</h1>
    <div class="sub">Dostęp chroniony hasłem</div>
    <input id="pwd" type="password" placeholder="Hasło" autocomplete="current-password">
    <button id="pwd-btn">Zaloguj</button>
    <div id="login-err"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
  <div class="top">
    <span class="brand">VW · Gazda Katowice</span>
    <h1>Dashboard dzienny</h1>
    <span class="date" id="hdr-date"></span>
  </div>
  <nav class="tabs" id="main-tabs"></nav>
  <nav class="subtabs" id="sub-tabs"></nav>
  <div class="section" id="content"></div>
  <footer id="foot"></footer>
</div>

e niepokoi z autem, co faktycznie było dobrym pytaniem bo zdecydowałam się na wymianę wycieraczek. Jak dziś zabierałam auto (było na Servisie 4 h) to okazało się że mi jeszcze servis perfekcyjnie umył auto i nawet odkurzył wewnątrz. Mega profesjonalnie i miło zaskakujące dla mnie podejścia. Jeśli zastanawiasz się nad kupnem lub serwisem auta to tylko do dwóch fachowców swojej sprawy (Pan Oskar od doboru auta, a Pan Marcin od serwisu)! Ogromnie i z całego serca polecam! Nigdy nie byłam tak zadowolona!"}, {"data": "14.10.2026", "nazwa": "NAZARII P.", "handlowiec": "Małgorzata", "nowa": false, "tresc": "Z całego serca polecam współpracę z panią Małgorzatą P-P! To niezwykle profesjonalna, cierpliwa i zaangażowana osoba. Przez cały proces zakupu samochodu czułem się zaopiekowany, a pani Małgorzata chętnie i wyczerpująco odpowiadała na każde moje pytanie. Rzadko spotyka się tak serdeczne i uczciwe podejście do klienta w branży motoryzacyjnej. Samochód idealnie spełnia moje oczekiwania, a cała transakcja przebiegła sprawnie i w świetnej atmosferze. Dziękuję!"}, {"data": "13.10.2026", "nazwa": "ŁUKASZ D.", "handlowiec": "Kacper", "nowa": false, "tresc": "Bardzo polecam salon, obsługa miła i sympatyczna. Na szczególne uznanie zasługuje handlowiec Kacper."}, {"data": "09.10.2026", "nazwa": "MatyS", "handlowiec": "Oskar", "nowa": false, "tresc": "Ogromnie polecam salon Grupy Gazda w Katowicach. Przyjechałem tutaj specjalnie z Łodzi i się nie zawiodłem. Pan Oskar załatwił wszystko od A do Z, dopasował ofertę samochodu do moich potrzeb i wymagań. Cały czas byliśmy w kontakcie, byłem informowany o kolejnych krokach, a na koniec wydanie pojazdu to czysta przyjemność. Czy przyjadę tutaj po kolejny pojazd? Oczywiście!"}, {"data": "08.10.2026", "nazwa": "Krzysiek H.", "handlowiec": "Małgorzata", "nowa": false, "tresc": "Nigdy nie byłem zwolennikiem marki VW i nie rozważałem nawet zakupu auta tej marki. Jednak wystarczyło krótkie zapytanie o konkretny egzemplarz (dostępny tylko w Volkswagen Gazda Group Katowice), żebym po krótkim czasie wyjechał z salonu Golfem GTE. Myślę, że w 90% jest to zasługa profesjonalizmu i zaangażowania poszczególnych pracowników salonu z którymi miałem ogromną przyjemność się kontaktować. Bardzo doceniam również natychmiastową reakcję na moje jakiekolwiek uwagi. Rewelacja bo cały proces przebiegał z nieustannym, wspaniałym uśmiechem."}, {"data": "07.10.2026", "nazwa": "Klaudia W.", "handlowiec": "Anita", "nowa": false, "tresc": "To mój pierwszy samochód z salonu i myślę, że super trafiłam. Pani Anita poprowadziła cały proces zakupowy od początku do końca, wszystko profesjonalnie i w miłej atmosferze. A samochód? Przesiadka z Polo 2004 na Polo 2026 jest naprawdę fajnym uczuciem 🙂 Jeśli ktoś szuka nowego Volkswagena to polecam VW Gazda Group Katowice, a w szczególności Panią Anitę 🙂"}, {"data": "05.10.2026", "nazwa": "JULIA S.", "handlowiec": "Anita", "nowa": false, "tresc": "Wszelkie formalności związane z zakupem naszego nowego samochodu załatwialiśmy z Panią Anitą. Bardzo miła osoba i niezwykle komunikatywna. Jedocześnie bardzo konkretna, rzetelna i kompetentna. Pani Anita podczas wydawania nam samochodu wykazała się dużą wiedzą i pełnym profesjonalizmem. jeszcze raz bardzo dziękujemy. Mariusz i Marzena Szczecińscy."}, {"data": "01.10.2026", "nazwa": "BARBARA B.", "handlowiec": "Oskar", "nowa": false, "tresc": "Jak kupować Volkswagena to tylko w salonie Gazda Group w Katowicach .Jest to mój trzeci Volkswagen ,ale nigdzie nie zostałam tak obsłużona jak w tym salonie .Pan Oskar świetny fachowiec -konkretnie ,szybko ,sprawnie -pełna profeska .Auto zgodnie z ustaleniami po tygodniu do odbioru .Duże zaskoczenie przy odbiorze -piękna czerwona kokarda ,upominek od firmy -no nigdzie do tej pory nie było tego w żadnym innym salonie VW .Dziekuje .Zakup u Was to przyjemność .Panie Oskarze widzimy się za dwa lata przy kolejnym zakupie .ðSerdecznie pozdrawiam Barbara Bochenek Chrzanów"}, {"data": "30.09.2026", "nazwa": "KAZIMIERZ", "handlowiec": "Fabian", "nowa": false, "tresc": "Wszystko OK.W szczególności SZACUN,dla Pana Fabiana Jóžwiaka,za pełny profesjonalizm"}, {"data": "30.09.2026", "nazwa": "XRIXBR B.", "handlowiec": "Fabian", "nowa": false, "tresc": "Polecam Pana Fabiana Józwiaka. profesjonalna obsługa"}, {"data": "30.09.2026", "nazwa": "ZUZANNA M.", "handlowiec": "Anita", "nowa": false, "tresc": "Dziękuję Pani Anicie, super obsługa ❤️"}, {"data": "30.09.2026", "nazwa": "OLA L.", "handlowiec": "Anita", "nowa": false, "tresc": "Dziękuję Pani Anicie, super obsługa ❤️"}, {"data": "29.09.2026", "nazwa": "TOMASZ M.", "handlowiec": "Konrad", "nowa": false, "tresc": "Zakup samochodu z pomocą pana Konrada to czysta przyjemność. Na szczególne wyróżnienie zasługuje jego podejście do klienta – wysoka kultura osobista, cierpliwość i ciągła opieka nad całym procesem. Największe brawa należą się za wzorowy przepływ informacji: przez cały czas byłem na bieżąco informowany o kolejnych krokach i dokładnie wiedziałem, na jakim etapie jesteśmy, na co czekamy i co ja muszę dostarczyć żeby wszystko działo się zgodnie z planem. Zdecydowanie polecam współpracę z panem Konradem!"}, {"data": "28.09.2026", "nazwa": "MARCEL W.", "handlowiec": "Kacper", "nowa": false, "tresc": "Odebrałem dziś nowego T-Roca. Kacper przeprowadził mnie przez cały proces szybko i sprawnie - dzięki!"}, {"data": "28.09.2026", "nazwa": "MIRKA W.", "handlowiec": "Małgorzata", "nowa": false, "tresc": "Bardzo dziękuję za fachową pomoc Pani Małorzacie w doborze nowego samochodu. Polecam Panią handlowiec oraz salon samochodowy."}, {"data": "28.09.2026", "nazwa": "TOMASZ J.", "handlowiec": "Anita", "nowa": false, "tresc": "Bardzo polecam salon VW przy alei Murckowskiej w Katowicach. Cały proces zamówienia i zakupu auta przebiegł bardzo szybko i sprawnie, a obsługa była na najwyższym poziomie. Szczególne podziękowania należą się pani Anicie, która była pomocna na każdym etapie, wszystko dokładnie wyjaśniając. Zdecydowanie polecam!"}, {"data": "26.09.2026", "nazwa": "WERONIKA K.", "handlowiec": "Oskar", "nowa": false, "tresc": "Dziękuję Panu Oskarowii za perfekcyjną obsługę"}, {"data": "26.09.2026", "nazwa": "GERARD G.", "handlowiec": "Konrad", "nowa": false, "tresc": "Serdecznie polecam Pana Konrada za profesjonalną i bardzo miłą obsługę w salonie. Od początku wykazał się dużą empatią, zaangażowaniem i cierpliwością, a także pomógł sprawnie przejść przez wszystkie formalności. Pełen profesjonalizm i świetne podejście do klienta. Dziękuję za pomoc!"}, {"data": "26.09.2026", "nazwa": "GABRIELA M.", "handlowiec": "Konrad", "nowa": false, "tresc": "Świetny salon z niesamowitą obsługą. Pan Konrad to jeden z najlepszych specjalistów do sprzedaży aut, z jakim miałam przyjemność rozmawiać. Najlepiej opisują go słowa: profesjonalizm, dokładność a także cierpliwość. Cenię sobie też kulturę osobistą Pana Konrada. Podczas procedury kupna auta, na każdym kroku czułam się zaopiekowana. Więc, jeśli zastanawiasz się przyszły kliencie nad zakupem VW to polecam GG Katowice i Pana Konrada!"}, {"data": "26.09.2026", "nazwa": "DAMIAN B.", "handlowiec": "Konrad", "nowa": false, "tresc": "Jesteśmy bardzo zadowoleni z nowego VW Taigo. Podziękowania dla Pana Konrada za profesjonalne podejście do klienta. ð"}, {"data": "26.09.2026", "nazwa": "KAMILA B.", "handlowiec": "Konrad", "nowa": false, "tresc": "Świetna obsługa i profesjonalizm pana Konrada. Zakup auta przebiegł idealnie, bardzo polecam!"}, {"data": "26.09.2026", "nazwa": "LUCYNA K.", "handlowiec": "Konrad", "nowa": false, "tresc": "Kupiłam samochód w Salonie GG i jestem bardzo zadowolona z obsługi w salonie. W czasie w którym kupowałam samochód był duży wybór samochód \"od ręki\". Nikt nie pogania, nie naciska a tylko doradza i pokazuje jakie są możliwości. Pan Konrad profesjonalnie doradził mi w wyborze samochodu dopasowanego do moich potrzeb. Polecam!"}, {"data": "25.09.2026", "nazwa": "JUSTYNA S.", "handlowiec": "Oskar", "nowa": false, "tresc": "Bardzo polecam. Obsluga na najwyższym poziomie. Rzetelne odpowiedzi na wszelkie pytania. P. Oskar bardzo profesjonalnie przeprowadzil nas przez caly proces zakupu"}, {"data": "25.09.2026", "nazwa": "PAULINA K.", "handlowiec": "Oskar", "nowa": false, "tresc": "Polecam! Pan Oskar doskonałe podejście do klienta"}, {"data": "25.09.2026", "nazwa": "BEATA L.", "handlowiec": "Oskar", "nowa": false, "tresc": "Polecam bardzo. Pan Oskar bardzo profesjonalny sprzedawca."}, {"data": "25.09.2026", "nazwa": "KINGA N.", "handlowiec": "Oskar", "nowa": false, "tresc": "Proces wyboru samochodu przeprowadzony przez Pana Oskara zasługuje na ocenę 5 gwiazdek. Dzięki profesjonalnemu podejściu, sporym zaangażowaniu i szybkim kontakcie zakup samochodu w tym salonie okazał się bardzo dobrą decyzją."}, {"data": "25.09.2026", "nazwa": "GABRIELA S.", "handlowiec": "Oskar", "nowa": false, "tresc": "Polecam sprzedawcę Oskar!"}, {"data": "25.09.2026", "nazwa": "JULIA P.", "handlowiec": "Oskar", "nowa": false, "tresc": "Pan Oskar sprzedawca godny polecenia!!!"}, {"data": "25.09.2026", "nazwa": "MIRELLA M.", "handlowiec": "Oskar", "nowa": false, "tresc": "Bardzo przyjemny salon, wszystko cierpliwie wytłumaczone :) obsługiwał mnie Pan Oskar, dziękuję i do zobaczenia"}, {"data": "25.09.2026", "nazwa": "SAD W.", "handlowiec": "Oskar", "nowa": false, "tresc": "Chciałbym serdecznie podziękować Panu Oskarowii za pełen profesjonalizm, zaangażowanie i świetne podejście podczas całego procesu zakupu VW Polo. Sam odbiór auta przebiegł w świetnej atmosferze i z dużą dbałością o każdy szczegół. Profesjonalna obsługa, świetny kontakt, indywidualne podejście i pozytywna atmosfera sprawiły, że zakup Polo był naprawdę przyjemnym doświadczeniem. Panie Oskarze — dziękuję za pomoc i zaangażowanie. Zdecydowanie polecam współpracę z Panem Oskarem każdemu, kto szuka profesjonalnego i godnego zaufania doradcy przy zakupie Volkswagena."}, {"data": "25.09.2026", "nazwa": "E S.", "handlowiec": "Oskar", "nowa": false, "tresc": "Bardzo jestem zadowolona z wizyty.Pan Oskar profesjonalny sprzedawca godny polecenia ð"}, {"data": "25.09.2026", "nazwa": "HALINA C.", "handlowiec": "Oskar", "nowa": false, "tresc": "Bardzo dziękuję panu Oskarowii za profesjonalne podejście"}, {"data": "25.09.2026", "nazwa": "KATERYNA K.", "handlowiec": "Konrad", "nowa": false, "tresc": "Bardzo dziękujemy Panu Konradu! Jest świetnym specjalistą, poświęcił nam wiele czasu i szczegółowo omówił wszystkie opcje. Jest oddany swojej pracy i stanowi eksperta w swojej dziedzinie."}, {"data": "24.09.2026", "nazwa": "WIK T.", "handlowiec": "Małgorzata", "nowa": false, "tresc": "Bardzo polecam salon Volkswagen Gazda Group Katowice a szczególnie Panią Małgorzatę, która była ze mną od pierwszego dnia, przedstawiając ofertę i pomagając w doborze, należy podkreślić jej wysoką kulturę osobistą i umiejętność pracy z klientem, dzięki czemu mój zakup od pierwszego dnia i złożenia zamówienia aż po odbiór gotowego do wydania samochodu i wyjazdu z salonu przebiegał nienagannie, żadnych problemów, wszystko zgodnie z ustaleniami w momencie złożenia zamówienia. Liczę również na równie owocną współpracę w kwestii serwisowania naszego pojazdu w Państwa serwisie."}, {"data": "24.09.2026", "nazwa": "KRYSTIAN K.", "handlowiec": "Anita", "nowa": false, "tresc": "Sprzedawca Pani Anita. Sprawnie szybko z klasą. Śmiało mogę polecić a sam trafiłem przez stronę internetową. Z ubezpieczeniem u Pani Aleksandry Kawon to samo. Polecam"}, {"data": "21.09.2026", "nazwa": "BENIAMIN K.", "handlowiec": "Oskar", "nowa": false, "tresc": "Podziękowania dla pana Oskara za sprawną pomoc w zakupie nowego samochodu i dopilnowania wszelkich formalności."}, {"data": "16.09.2026", "nazwa": "JANUSZ S.", "handlowiec": "Małgorzata", "nowa": false, "tresc": "Bardzo profesjonalnie przeprowadzona procedura sprzedaży leasingu ubezpieczenia i wydanie samochodu przez bardzo młodą panią Małgosię która potrafiła też wszystko wyjaśnić."}, {"data": "11.09.2026", "nazwa": "KRZYSZTOF O.", "handlowiec": "Małgorzata", "nowa": false, "tresc": "Profesjonalne podejście, wiedza i miła obsługa to klucz do tych pięciu gwiazdek. Tak trzymać Pani Małgorzato"}, {"data": "09.09.2026", "nazwa": "KAMIL B.", "handlowiec": "Fabian", "nowa": false, "tresc": "Polecam najmocniej, Pan Fabian dopracował temat na 5, bardzo sprawna realizacja"}, {"data": "08.09.2026", "nazwa": "GRZEGORZ T.", "handlowiec": "Fabian", "nowa": false, "tresc": "Bardzo miła profesjonalna obsługa przez Pana Fabiana w trakcie zakupu samochodu, polecam."}, {"data": "08.09.2026", "nazwa": "CINE M.", "handlowiec": "Oskar", "nowa": false, "tresc": "Tayron w najlepszej konfiguracji od najlepszego sprzedawcy – Pana Oskara! ❤️ Świetna cena, świetna obsługa i naprawdę bezkonkurencyjna oferta. Polecamy tego Pana!"}, {"data": "05.09.2026", "nazwa": "ŁUASZ S.", "handlowiec": "Fabian", "nowa": false, "tresc": "Polecam salon i Pana Fabiana! Wszystko sprawnie i profesjonalnie."}, {"data": "04.09.2026", "nazwa": "MARTIN C.", "handlowiec": "Kacper", "nowa": false, "tresc": "Pan Kacper, bardzo pomocy i cierpliwy. Serdecznie polecam"}, {"data": "04.09.2026", "nazwa": "ANETA A.", "handlowiec": "Kacper", "nowa": false, "tresc": "Świetna obsługa przez Kacpra. Profesjonalny,cierpliwy ."}, {"data": "02.09.2026", "nazwa": "STRAŻ", "handlowiec": "Małgorzata", "nowa": false, "tresc": "Super obsługa ze strony Pani Małgorzaty"}, {"data": "31.08.2026", "nazwa": "BARTŁOMIEJ C.", "handlowiec": "Małgorzata", "nowa": false, "tresc": "Serdecznie polecam Panią Małgorzatę ! Bardzo miła doradczyni!"}, {"data": "31.08.2026", "nazwa": "LOKROSS", "handlowiec": "Oskar", "nowa": false, "tresc": "Dzięki Panu Oskarowi udało spełnić się marzenia :) Świetny obsługa finansowa, wydanie auta, kontakt oraz cały proces. Polecam"}, {"data": "31.08.2026", "nazwa": "TYMOTEUSZ P.", "handlowiec": "Konrad", "nowa": false, "tresc": "Polecam. Bardzo profesjonalnie. Szczególne podziękowania dla Pana Konrada."}, {"data": "31.08.2026", "nazwa": "MARCIN S.", "handlowiec": "Konrad", "nowa": false, "tresc": "Wspaniała obsługa od początku do końca! Chciałbym serdecznie podziękować panu Konradowi za pełen profesjonalizm, ogromną cierpliwość i indywidualne podejście do klienta w salonie Gazda VW Katowice. Cały proces zakupu przebiegł w miłej atmosferze, a wszystkie formalności zostały załatwione sprawnie i bezstresowo. Zdecydowanie polecam każdemu, kto szuka wymarzonego auta!"}, {"data": "31.08.2026", "nazwa": "ROBERT K.", "handlowiec": "Oskar", "nowa": false, "tresc": "Chciałbym bardzo serdecznie podziękować Panu Oskarowii za bardzo profesjonalne podejście jeżeli chodzi o proces zamówienia VW Taigo oraz świetny kontakt w trakcie oczekiwania na pojazd. Samochód był do odbioru miesiąc przed wyznaczoną datą. Przy odbiorze otrzymaliśmy jeszcze miły upominek oraz vouchery. Kawa w salonie bardzo smaczna :) Polecam z czystym sumieniem współpracę z Panem Oskarem :)"}, {"data": "28.08.2026", "nazwa": "WIKTOR L.", "handlowiec": "Anita", "nowa": false, "tresc": "Polecam z całego serca ofertę tego salonu. Pani Anita pomogła w wyborze samochodu dla mnie. Od samego pomysłu i poszukiwania oferty, do podpisania dokumentów i odbioru końcowego służyła fachową radą oraz pomocą. Efekt końcowy był fantastyczny, wszystko wyszło dokładnie jak sobie wymarzyłem. Pozdrawiam oraz polecam"}, {"data": "27.08.2026", "nazwa": "ALINA G.", "handlowiec": "Kacper", "nowa": false, "tresc": "Wspaniała obsługa, wysoki profesjonalizm, a wszystko w bardzo przyjemnej atmosferze. Pan Kacper nieocenione wsparcie w tym procesie."}, {"data": "26.08.2026", "nazwa": "KRZYSIEK H.", "handlowiec": "Anita", "nowa": false, "tresc": "Pani Anita bardzo dobra specjalistka godna polecenia."}, {"data": "25.08.2026", "nazwa": "PAULINA G.", "handlowiec": "Kacper", "nowa": false, "tresc": "Gorąco polecam współpracę z Panem Kacprem. Świetne podejście do klienta. Genialnie doradził przy wyborze auta. Każda kwestia została ogarnięta bez najmniejszego problemu, a transakcja przebiegła bezstresowo i profesjonalnie."}, {"data": "24.08.2026", "nazwa": "PIOTR", "handlowiec": "Małgorzata", "nowa": false, "tresc": "Chciałabym serdecznie polecić Panią Małgorzatę z salonu Volkswagen. Od początku kontakt był bardzo miły i profesjonalny. Pani Małgorzata wykazała się dużą wiedzą, cierpliwością i zaangażowaniem, a przy tym wszystko dokładnie i przystępnie wyjaśniła. Cały proces przebiegł sprawnie i w bardzo przyjaznej atmosferze. Widać, że naprawdę zależy jej na zadowoleniu klienta. Zdecydowanie polecam i dziękuję za świetną obsługę!"}, {"data": "22.08.2026", "nazwa": "TOMEK L.", "handlowiec": "Konrad", "nowa": false, "tresc": "To już kolejny model samochodu, który odbieramy z Gazda Group i po raz kolejny jesteśmy zachwyceni! Współpraca z panem Robertem oraz panem Konradem to czysta przyjemność. Pełen profesjonalizm, świetny kontakt i zaangażowanie na każdym etapie transakcji. Cały proces przebiegł sprawnie, a obsługa była po prostu rewelacyjna. Gorąco polecam ten salon i ten niezawodny zespół!"}, {"data": "21.08.2026", "nazwa": "MICHAŁ S.", "handlowiec": "Konrad", "nowa": false, "tresc": "Jestem bardzo zadowolony z Pana Konrada. Pan Konrad zrobił super ofertę na samochód, podczas przekazania Golfa wszystko wytłumaczył i pokazał każdą opcję w aucie. Pan Konrad to prawdziwy pasjonata w tym fachu i widać że ta praca sprawia mu satysfakcję. Po zakupie auta nadal był kontakt i pomoc w drobnych pytaniach na temat samochodu. Naprawdę polecam Pana Konrada."}, {"data": "21.08.2026", "nazwa": "ŁUKASZ", "handlowiec": "Oskar", "nowa": false, "tresc": "Polecam p. Oskara! super opieka i obsługa na najwyższym poziomie. przeprowadził mnie przez cały proces związany z najmem auta 🙂"}, {"data": "18.08.2026", "nazwa": "ALDONA G.", "handlowiec": "Anita", "nowa": false, "tresc": "Zakup samochodu w tym salonie to była czysta przyjemność, a wszystko to zasługa Anity. Od pierwszego kontaktu wykazała się ogromnym profesjonalizmem i świetnym doradztwem. Sam moment wydania auta całkowicie przerósł moje oczekiwania – piękna czerwona kokarda, winko i wspaniała atmosfera sprawiły, że ten dzień był naprawdę wyjątkowy. Serdecznie dziękuję za poświęcony czas i pomoc w spełnieniu mojego marzenia! Jeśli planujecie zakup nowego VW, gorąco polecam Volkswagen Gazda Group Katowice."}, {"data": "17.08.2026", "nazwa": "ZDZISŁAW K.", "handlowiec": "Kacper", "nowa": false, "tresc": "Bardzo porządna obsługa. Doradca Pan Kacper to profesjonalista. Troszczył się o klienta od pierwszego telefonu po oddanie kluczyków auta. Doradził wytłumaczył i był zawsze pomocny. Z takimi doradcami sprzedaży volkswagen nie zginie. Ocena na 6+ jestem zadowolony z całego procesu zakupu."}, {"data": "16.08.2026", "nazwa": "MARCIN C.", "handlowiec": "Kacper", "nowa": false, "tresc": "Zdecydowanie polecam salon Volkswagen Gazda Group w Katowicach, w ramach poszukiwań nowego samochodu odwiedziłem i kontaktowałem się z kilkoma salonami, ale to tutaj Pan Kacper wzbudził moje największe zaufanie jako handlowiec. Faktycznie od początku do końca zadbał o cały proces zakupu. Wszystkie zapewnienia dotyczące czy to terminu odbioru pojazdu czy warunków finansowania zostały w pełni dochowane, oferta była bardzo dobra i przedstawiona w sposób czytelny i uczciwy. Z dużym prawdopodobieństwem wrócę tu po raz kolejny."}, {"data": "15.08.2026", "nazwa": "VICTORIA Ł.", "handlowiec": "Anita", "nowa": false, "tresc": "Zakup samochodu oraz polisy przebiegł sprawnie i bezproblemowo. Dzięki Pani Anicie wszystko odbyło się w swobodnej i miłej atmosferze. Jestem bardzo zadowolona z całej obsługi i zdecydowanie polecam!"}, {"data": "13.08.2026", "nazwa": "WIESŁAW", "handlowiec": "Kacper", "nowa": false, "tresc": "Sprzedaż ze strony dealera prowadził Pan Kacper. Obsługa prowadzona wzorcowo. Pozostali pracownicy również uczynliwi. Zakup VW Taigo jestem bardzo zadowolony z obsługi i samochodu."}, {"data": "13.08.2026", "nazwa": "DAMIAN I.", "handlowiec": "Konrad", "nowa": false, "tresc": "Bardzo polecam Pana Konrada, profesjonalna obsługa od pierwszego dnia. Stały kontakt przez cały okres oczekiwania na auto."}, {"data": "11.08.2026", "nazwa": "MATEUSZ S.", "handlowiec": "Kacper", "nowa": false, "tresc": "Bardzo polecam! Wszystko przebiegło szybko, sprawnie i bez żadnych problemów. Duży plus za profesjonalne podejście, dobry kontakt i przede wszystkim terminowość. Wszystkie formalności zostały załatwione bardzo szybko, a cały proces przeszedł bardzo sprawnie od zamówienia po wydanie samochodu. Widać, że Pan Kacper podchodzi do swojej pracy naprawdę solidnie. Jestem bardzo zadowolony z obsługi i zdecydowanie polecam!"}, {"data": "10.08.2026", "nazwa": "SEBASTIAN S.", "handlowiec": "Kacper", "nowa": false, "tresc": "Kontakt z P. Kacprem od samego początku wzorowy, bardzo polecam"}, {"data": "10.08.2026", "nazwa": "BARTOSZ R.", "handlowiec": "Małgorzata", "nowa": false, "tresc": "Z czystym sumieniem polecam VW Gazda Group! Świetna obsługa, pełen profesjonalizm i bardzo dobre podejście do klienta. Szczególne podziękowania dla Pani Małgorzaty za pomoc przy konfiguracji samochodu oraz sprawne przygotowanie finansowania. Dziękuję również Pani Anicie, która w zastępstwie zajęła się wydaniem samochodu. Cały proces przebiegł sprawnie, szybko i bezproblemowo."}, {"data": "07.08.2026", "nazwa": "BARBARA R.", "handlowiec": "Małgorzata", "nowa": false, "tresc": "Gorąco polecamy Panią Małgorzatę za jej podejscie do klienta, cierpliwość i ogromną wiedzę. Dzięki niej zdecydowaliśmy się na VW Tiguana."}, {"data": "05.08.2026", "nazwa": "GIZELA R.", "handlowiec": "Anita", "nowa": false, "tresc": "Serdecznie polecam salon Volkswagen Gazda w Katowicach! Wczoraj odbierałam swoje nowe auto i jestem bardzo zadowolona z obsługi. Szczególne podziękowania dla Pani Anity za profesjonalizm, życzliwość i cierpliwość. Wszystko dokładnie wyjaśniła i sprawiła, że odbiór samochodu przebiegł w bardzo miłej atmosferze. Obsługa na najwyższym poziomie. Dziękuję!"}, {"data": "05.08.2026", "nazwa": "GRZEGORZ U.", "handlowiec": "Anita", "nowa": false, "tresc": "Tydzień temu wyjechałem z salonu VW Gazda Grup Katowice nowym T-ROC. Podziękowania dla Pani Anity – pełen profesjonalizm. Dziękuję i pozdrawiam."}, {"data": "31.07.2026", "nazwa": "PIOTREK X.", "handlowiec": "Konrad", "nowa": false, "tresc": "Już prawie miesiąc jestem szczęśliwym posiadaczem GTI. Bardzo się cieszę że trafiłem właśnie do GG Katowice i Pana Konrada. Cały proces zakupu przebiegł bardzo sprawnie, o wszystkich jego etapach zostałem bardzo dokładnie poinformowany, można powiedzieć że \"poprowadzony za rączkę\". Kontakt z Panem Konradem super, jego wiedza motoryzacyjna na wysokim poziomie, miło było pogadać. Pozdrawiam"}, {"data": "31.07.2026", "nazwa": "HUMAN L. I.", "handlowiec": "Oskar", "nowa": false, "tresc": "Niesamowita obsługa. Jestem na maksa pozytywnie zaskoczony profesjonalizmem, szybkością oraz dotrzymywanym słowom. Zarówno dział sprzedaży aut nowych i Pan Oskar jak również dział aut używanych Pan Patryk spisali się na medal. Dziękuję. Tayron spisuje się również na medal :)"}, {"data": "31.07.2026", "nazwa": "OSKAR C.", "handlowiec": "Konrad", "nowa": false, "tresc": "Pełen profesjonalizm i świetna obsługa. Pan Konrad to osoba kompetentna, pomocna i zaangażowana. Wszystko zostało jasno wyjaśnione, a cały proces przebiegł sprawnie. Zdecydowanie polecam współpracę z Panem Konradem!"}, {"data": "31.07.2026", "nazwa": "DAMIAN B.", "handlowiec": "Konrad", "nowa": false, "tresc": "Dziękuję Panu Konradowi za miłą i profesjonalną obsługę podczas zakupu nowego pojazdu. Pozdrawiam i polecam kontakt z Panem Konradem."}, {"data": "31.07.2026", "nazwa": "AGNIESZKA B.", "handlowiec": "Konrad", "nowa": false, "tresc": "Wczoraj odebrałam wymarzone auto w Salonie GG. Bardzo serdecznie dziękuję panu Konradowi za wszelką miłą oraz profesjonalną pomoc."}, {"data": "31.07.2026", "nazwa": "SYLWIA G.", "handlowiec": "Oskar", "nowa": false, "tresc": "Dzień dobry. Wczoraj odebraliśmy z mężem pięknego Volkswagena T-Roc. Obsłu IKA P.", "handlowiec": "Oskar", "nowa": false, "tresc": "W piątek odebrałam nowe autko TRoc. Cały proces sprzedaży przebiegał bardzo sprawnie i komfortowo przy dużym wsparciu i zaangażowaniu Pana Oskara. Serdecznie polecam ten salon i osobę Pana Oskara - pełen profesjonalizm"}, {"data": "20.07.2026", "nazwa": "TOMASZ D.", "handlowiec": "Oskar", "nowa": false, "tresc": "Vw Touareg - kupiony w VW Gazda, rozmowa prowadzona od początku z p.Oskarem. Polecam firmę, polecam p.Oskara. Wszystko tak jak uzgodniliśmy."}, {"data": "18.07.2026", "nazwa": "MAREKK S.", "handlowiec": "Kacper", "nowa": false, "tresc": "Dzisiaj odebrałem samochód. Cały proces zakupowy przebiegł niezwykle sprawnie. Bardzo profesjonalna obsługa. Szczególne podziękowania dla Pana Kacpra, za profesjonalizm, fachowe doradztwo. Polecam wszystkim to miejsce"}, {"data": "17.07.2026", "nazwa": "AMIR M.", "handlowiec": "Małgorzata", "nowa": false, "tresc": "I recently purchased a Golf R from Volkswagen Gazda Group Katowice. The purchase process was smooth overall, and Małgorzata was very helpful throughout. She was responsive, supportive, and made the experience much easier. Thank you for the professional service, and I'm enjoying the car."}, {"data": "13.07.2026", "nazwa": "MARCIN M.", "handlowiec": "Małgorzata", "nowa": false, "tresc": "Z czystym sumieniem polecam salon Volkswagen Gazda Group Katowice, a w szczególności Panią Małgorzatę! Miałem przyjemność współpracować z Panią Małgorzatą przy zakupie limitowanej wersji VW Touarega Final Edition. Od samego początku, przez twarde negocjacje ceny, aż po niezwykle wymagające procedury leasingowe dla gospodarstwa rolnego – pełen profesjonalizm, ogromna cierpliwość i stały kontakt o każdej porze. Pani Małgorzata osobiście dopilnowała każdego detalu, wywalczyła dla mnie świetne warunki finansowe i sprawiła, że samochód odebrałem przygotowany perfekcyjnie. Jeśli kupować nowego Volkswagena, to tylko u niej. Klasa sama w sobie! Pozdrawiam, Marcin."}, {"data": "02.07.2026", "nazwa": "ILETUJEST R.", "handlowiec": "Oskar", "nowa": false, "tresc": "Mimo, że tego dnia nie zdecydowaliśmy ostatecznie sie na zakup to muszę polecić to miejsce. Bardzo miła i uzbrojona w wiedzę obsługa. Szczególnie Pan Oskar"}, {"data": "30.06.2026", "nazwa": "OLA M.", "handlowiec": "Kacper", "nowa": false, "tresc": "Polecam serdecznie Pana Kacpra. Cała transakcja przebiegła bardzo sprawnie i szybko. Nie mam najmniejszych zastrzeżeń. Na pewno będę polecać innym. Pozdrawiam."}, {"data": "30.06.2026", "nazwa": "MM", "handlowiec": "Oskar", "nowa": false, "tresc": "Bardzo pozytywnie oceniam obsługę Pana Oskara. Jest osobą niezwykle uprzejmą, kompetentną i zaangażowaną. Z dużą cierpliwością odpowiadał na wszystkie pytania, wszystko dokładnie wyjaśniał i zadbał o miłą atmosferę podczas wizyty. Profesjonalne podejście oraz wysoka kultura osobista sprawiły, że czułam się bardzo dobrze obsłużona. Zdecydowanie polecam kontakt z Panem Oskarem – to osoba, która potrafi zadbać o klienta na najwyższym poziomie."}, {"data": "30.06.2026", "nazwa": "MACIEJ D.", "handlowiec": "Małgorzata", "nowa": false, "tresc": "Zakup samochodu przy obsłudze Pani Małgorzaty przebiegł sprawnie i bez żadnych komplikacji. Jestem bardzo zadowolony z obsługi oraz profesjonalnego podejścia do klienta."}, {"data": "30.06.2026", "nazwa": "WIKTOR F.", "handlowiec": "Małgorzata", "nowa": false, "tresc": "estem bardzo zadowolony z kontaktu i podejścia do klienta. Pani Małgorzata wykazała się dużą wiedzą i zaangażowaniem. Serdecznie polecam!"}, {"data": "29.06.2026", "nazwa": "RADOSŁAW B.", "handlowiec": "Oskar", "nowa": false, "tresc": "Zdecydowanie polecam ten salon! Odbierałem tutaj swojego Golfa R i cały proces przebiegł wzorowo. Świetna cena, profesjonalna obsługa oraz pełne zaangażowanie na każdym etapie zakupu. Szczególne podziękowania dla sprzedawcy Oskara pełen profesjonalizm, bardzo dobry kontakt i ogromna wiedza. Co ważne, obsługa nie kończy się w momencie wydania auta. Wsparcie posprzeda liwość mimo wielu pytań i zmian konfiguracji. Od miesiąca Golf R świetnie sie sprawuje. Dzieki pomocy Pani Anity oraz pełnemu zaangażowaniu, wybór marki oraz salonu byl oczywisty."}, {"data": "22.06.2026", "nazwa": "CONNOR 9.", "handlowiec": "Anita", "nowa": false, "tresc": "Polecam salon Volkswagen Gazda Group Katowice. Na szczególną pochwałę zasługuje Pani Anita, która była z nami od pierwszego dnia, przedstawiając ofertę i pomagając w doborze odpowiedniej wersji wyposażenia, należy podkreślić jej wysokie kompetencje, znajomość modelu, opcji doposażenia i funkcji samochodu, także wysoką kulturę osobistą i umiejętność pracy z klientem, dzięki czemu nasz zakup od pierwszego dnia i złożenia zamówienia aż po odbiór gotowego do wydania samochodu i wyjazdu z salonu przebiegał nienagannie, żadnych problemów, wszystko zgodnie z ustaleniami w momencie złożenia zamówienia, jesteśmy wraz z żoną bardzo usatysfakcjonowani przebiegiem zakupu, liczymy również na równie owocną współpracę w kwestii serwisowania naszego pojazdu w Państwa serwisie, pozdrawiamy, zadowoleni wlasciciele nowego Volkswagen T-roc Style."}, {"data": "20.06.2026", "nazwa": "JACEK Z.", "handlowiec": "Anita", "nowa": false, "tresc": "Świetne doradztwo i profesjonalne podejscie ze strony Pani Anity. Dziękuję"}, {"data": "19.06.2026", "nazwa": "ŁUKASZ M.", "handlowiec": "Fabian", "nowa": false, "tresc": "W zeszłym miesiącu kupiłem zdalnie nowego T-crossa w bardzo dobrej ofercie. Pozdrawiam Pana Fabiana i ponownie dziękuję za pomoc, opłacało się przyjechać z Gdańska :) pozdrawiam również panią Aleksandrę za pomoc i super ofertę ubezpieczenia na miejscu!"}, {"data": "15.06.2026", "nazwa": "AGNIESZKA W.", "handlowiec": "Kacper", "nowa": false, "tresc": "Odbiór i zakup nowego samochodu był dla naszej rodziny doświadczeniem, które wyznacza nowe standardy obsługi w motoryzacji. Jako osoba na co dzień pracująca w biznesie, bardzo doceniam profesjonalizm, transparentność i dbałość o każdy etap procesu, a tutaj wszystko zagrało idealnie. To nie była tylko standardowa sprzedaż auta, to była przemyślana logistyka i kompleksowa opieka nad klientem na każdym etapie tej transakcji. Szczególne słowa uznania należą się Panu Kacprowi. Jako nasz specjalista ds. sprzedaży i koordynator całej inwestycji, Pan Kacper wykazał się niezwykłą proaktywnością i merytoryczną elegancją. Dzięki jego zaangażowaniu cały proces przebiegł bezstresowo, pozwalając nam skupić się wyłącznie na radości z zakupu. Wisienką na torcie był kreatywny akcent ze strony działu marketingu – konkurs piłkarski z okazji Mistrzostw Świata. To pokazuje, że salon rozumie, iż w relacjach biznesowych liczą się nie tylko cyfry, ale i emocje oraz pozytywna energia, które budują trwałe wspomnienia. Jeśli szukacie Państwo miejsca, gdzie najwyższa jakość obsługi spotyka się z nieszablonowym, ludzkim podejściem, z pełnym przekonaniem rekomenduję ten salon oraz współpracę z Panem Kacprem. Dziękujemy za ten świetny początek przygody z nowym autem!"}, {"data": "14.06.2026", "nazwa": "WŁODZIMIERZ W.", "handlowiec": "Konrad", "nowa": false, "tresc": "Wyrazy szacunku dla Pana Konrada. Dzięki za wsparcie i dużo cierpliwości. Oraz jeszcze za taką przyjazną atmosferę podczas całego procesu zakupowego. To zresztą czuło się w całej firmie. Raz jeszcze dziękuję."}, {"data": "10.06.2026", "nazwa": "MAŁGORZATA G.", "handlowiec": "Oskar", "nowa": false, "tresc": "Odwiedziliśmy dzisiaj salon .Mamy zamiar zakupu.Bylismy pod wrażeniem.Podszedl młody człowiek P.Oskar specjalista ds.sprzedaży samochodów.Bardzo szczegółowo wszystkie informacje jakimi byliśmy zainteresowani nam przekazał.Wiedzę na temat samochodu które nas interesuje ma ogromną.Jest to człowiek odpowiedni.Klient wychodzi z salonu z wiedzą która nas interesowała.Skorzystamy z jazdy próbnej i będziemy w kontakcie.Polecam wstąpić do Volkswagena.I uzyska się wszelkie wyczerpujące informację"}, {"data": "10.06.2026", "nazwa": "JAKUB W.", "handlowiec": "Konrad", "nowa": false, "tresc": "Chciałbym bardzo podziękować Panu Konradowi za pomoc przy zakupie mojego Golfa GTI. Od samego początku cały proces przebiegał w bardzo profesjonalnej i jednocześnie luźnej atmosferze. Konrad był zawsze dostępny, odpowiadał na wszystkie pytania i pomagał na każdym etapie zakupu. Dziękuję za zaangażowanie oraz podejście do klienta. Wszystko zostało dopięte sprawnie i bezproblemowo, a odbiór auta był czystą przyjemnością. Zdecydowanie polecam kontakt z Konradem i salonem Gazda Group w Katowicach każdemu, kto szuka nowego VW i oczekuje profesjonalnej obsługi."}, {"data": "09.06.2026", "nazwa": "KAZIMIERZ S.", "handlowiec": "Anita", "nowa": false, "tresc": "Samochód kupiony przy pierwszej wizycie. Serdecznie polecamy obsługę P.Anity i cieszymy się na odbiór nowego TRoca już niebawem."}, {"data": "08.06.2026", "nazwa": "DARIUSZ Ż.", "handlowiec": "", "nowa": false, "tresc": "Pierwszy raz udało mi się tak szybko i bezproblemowo kupić samochód. Przewidywałem dużo późniejsze termin odbioru niż ten, który nastąpił, dzięki czemu nie musiałem na urlop jechać starym niepewnym autem."}, {"data": "07.06.2026", "nazwa": "JANINA", "handlowiec": "Kacper", "nowa": false, "tresc": "Walizeczka dla JaNinki, bym nie miała smutnej minki. Taka pięknie ułożona, Ona dla i jest stworzona. Wizyty jak gwiazdki na niebie. Pan Kacper, podarował nam jedną z 5 wystawionych przez zadowolonych klientów. Pozdrawiamy"}, {"data": "04.06.2026", "nazwa": "BARBARA W.", "handlowiec": "Konrad", "nowa": false, "tresc": "Salon samochodowy i nasz dealer pan Konrad to pełny profesjonalizm. Miejsce i kompetencje pana Konrada sprawily, że obecnie jesteśmy właścicielami Tayron'a. W dni otwarte Salonu VW można poznać modele samochodów i bardzo miło spędzić czas. Żadne pytanie nie zostanie bez odpowiedzi."}, {"data": "01.06.2026", "nazwa": "EUGENIA J.", "handlowiec": "Anita", "nowa": false, "tresc": "Serdeczne podziękowania dla salonu Volkswagen Gazda w Katowicach przy ul. Murckowskiej za profesjonalną obsługę podczas zakupu samochodu. Szczególne podziękowania dla Pani Anity N. za fachowe doradztwo, zaangażowanie, cierpliwość i miłą atmosferę. Dzięki Pani profesjonalizmowi cały proces zakupu przebiegł sprawnie i bezproblemowo. Z przyjemnością polecam ten salon wszystkim poszukującym profesjonalnej obsługi."}, {"data": "01.06.2026", "nazwa": "HANNA D.", "handlowiec": "Magdalena", "nowa": false, "tresc": "Dzisiaj wyjechałam z Salonu Gazda Group w Katowicach pięknym nowym samochodem Volkswagen T - Cross. Wszystko zawdzięczam wspaniałej prowadzącej nasz zakup Pani Magdalenie. Od pierwszego spotkania Pani Magda wykazywała się wiedzą, kompetencją, rzetelnością, odpowiadała na wszystkie pytania. Zawsze była gotowa i chętna do pomocy również w kontaktach telefonicznych. Przedstawiała temat zakupu samochodu w wielu aspektach, a Jej dorady były rzeczowe i cenne. W dniu odbierania pojazdu rzeczowo i w łatwy sposób wytłumaczyła podstawy obsługi samochodu dzięki czemu bezpiecznie dotarliśmy do celu. Pełny profesjonalizm, życzliwość i bardzo miła atmosfera. Bardzo, bardzo dziękuję za wspaniałą obsługę i polecam w 100% Panią Magdalenę i Wasz salon"}, {"data": "01.06.2026", "nazwa": "JAROSŁAW G.", "handlowiec": "Fabian", "nowa": false, "tresc": "Gorąco polecam salon Gazda w Katowicach! Zakup Volkswagena T-Roc przebiegł w doskonałej atmosferze. Szczególne podziękowania dla Pana Fabiana – to absolutny profesjonalista i prawdziwy pasjonat motoryzacji. Świetne doradztwo i obsługa na najwyższym poziomie!"}], "opinie_poprzedni_raport": "21.10.2026", "trade_in_crm": {"miesiac": "2026-10", "miesiac_label": "Październik 2026", "aktywny": true, "biezacy": {"label": "Październik 2026", "wygrane": [{"data": "13.10.2026", "klient": "A.B.", "pojazd": "Seat Arona", "vin": "LR074969", "handlowiec": "Fabian"}], "ranking": [{"name": "Fabian", "przekazane": 3, "odkupione": 1, "konwersja": 33}, {"name": "Anita", "przekazane": 3, "odkupione": 0, "konwersja": 0}, {"name": "Małgorzata", "przekazane": 3, "odkupione": 0, "konw  T-RocHEV i Golf HEV – Opcja „Park Assist Pro” niedostępna do 07/2027!", "data": "IH 51/2026 · Informacja Produkcyjna na tydzień 40/2026", "tresc": "UWAGA: T-RocHEV i Golf HEV – Opcja „Park Assist Pro” niedostępna do 07/2027!"}, {"tytul": "T-RocHEV", "data": "IH 51/2026 · Informacja Produkcyjna na tydzień 40/2026", "tresc": "T-RocHEV Opcja „Park Assist Pro” [8A5] będzie niedostępna produkcyjnie do tygodnia 07/2027. „Park Assist Pro” został czasowo usunięty z GO i Konfiguratora klienckiego. Termin dostawy zamówienia z kodem [8A5] w specyfikacji to marzec 2027 - prosimy poinformować o tym Klientów. Alternatywą jest usunięcie kodu 8A5, samochód będzie wtedy wyposażony w „Park Assist Plus” [8A2], który jest standardem w wersjach Style oraz R-Line a jego produkcja będzie możliwa jeszcze w 2026 roku."}, {"tytul": "Golf HEV", "data": "IH 51/2026 · Informacja Produkcyjna na tydzień 40/2026", "tresc": "Golf HEV Opcja „Park Assist Pro” [PK2/PK3] będzie niedostępna produkcyjnie do tygodnia 07/2027. „Park Assist Pro” został czasowo usunięty z GO i Konfiguratora klienckiego. Termin dostawy zamówienia z kodem [PK2/PK3] w specyfikacji to marzec 2027. - prosimy poinformować o tym Klientów. Dla wersji Plus: standard wersji Plus zmienia się z kodu PK2/PK3 na PK6/PK7 - samochód będzie wtedy wyposażony w „Park Assist Plus” W pozostałych wersjach: istnieje możliwość całkowitej rezygnacji z opcji „Park Assist”. W przypadku już zebranych zamówień, w przypadku chęci rezygnacji z „Park Assist Pro” należy skontaktować się z Dysporegionem."}], "przerwy": [{"tytul": "Przerwy produkcyjne", "data": "IH 51/2026 · Informacja Produkcyjna na tydzień 40/2026", "pre": true, "tresc": "KOMUNIKATY\n▪ W związku z przełomem roku kalendarzowego przypominamy, że zamówienia klienckie opisane przez\nPaństwa spodziewaną datą realizacji do 15.02.2027, mogą zostać zaplanowane i wyprodukowane z datą\nCP8 2026.\nWynika to wprost z faktu potrzeby uwzględnienia zwyczajowej przerwy produkcyjnej między\ntygodniami 50/2 <script id="login-script">
/* ===== LOGOWANIE (SHA-256 + sessionStorage) + SPLASH =====
   Hasło: zmień PASS_HASH na sha256 nowego hasła.           */
(function () {
  var PASS_HASH = 'f9689197203df75a624fd47bcc58b643fb95a0d3cd71780c728c368b95cab872';
  var SKEY = 'gazda_dash_auth';
  var SPLASH_KEY = 'gazda_dash_splash';
  var mem = {};
  var store = {
    get: function (k) { try { return sessionStorage.getItem(k); } catch (e) { return mem[k] || null; } },
    set: function (k, v) { try { sessionStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
  };

  function sha256(str) {
    var buf = new TextEncoder().encode(str);
    return crypto.subtle.digest('SHA-256', buf).then(function (h) {
      var a = Array.from(new Uint8Array(h));
      return a.map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    });
  }

  function enter() {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    if (typeof window.renderApp === 'function') window.renderApp();
    if (!store.get(SPLASH_KEY)) {
      showSplash();
      store.set(SPLASH_KEY, '1');
    }
  }

  function tryLogin() {
    var v = document.getElementById('pwd').value;
    sha256(v).then(function (h) {
      if (h === PASS_HASH) {
        store.set(SKEY, h);
        enter();
      } else {
        document.getElementById('login-err').textContent = 'Nieprawidłowe hasło.';
      }
    });
  }

  /* ---------- SPLASH (HTML budowany konkatenacją stringów) ---------- */
  function showSplash() {
    var D = DATA;
    var c = D.cele;
    var pct = c.cel_zespolowy > 0 ? Math.round(c.wykonanie_realne / c.cel_zespolowy * 100) : 0;
    var fillCls = pct >= 80 ? 'good' : (pct >= 50 ? 'blue' : '');
    var aekPlus = 0, i;
    var obszary = Object.keys(D.stan_aek);
    for (i = 0; i < obszary.length; i++) aekPlus += D.stan_aek[obszary[i]].p;
    var przet120 = D.przet.w120.length;

    /* liderzy */
    var liderAAK = '—', maxA = 0;
    for (i = 0; i < c.cele.length; i++) {
      if (c.cele[i].wykonanie > maxA) { maxA = c.cele[i].wykonanie; liderAAK = c.cele[i].name; }
      else if (c.cele[i].wykonanie === maxA && maxA > 0) { liderAAK += ' / ' + c.cele[i].name; }
    }
    var liderAEK = '—', maxE = 0;
    var allH = D.handlowcy_detal.concat(D.handlowcy_flota);
    for (i = 0; i < allH.length; i++) {
      if (allH[i].d > maxE) { maxE = allH[i].d; liderAEK = allH[i].name; }
    }

    /* wykres koniunktury — budowany PRZED wstawieniem do overlay */
    var koniunkturaHTML = '';
    var daysHTML = '';
    for (i = 0; i < D.koniunktura.length; i++) {
      var k = D.koniunktura[i];
      var h = Math.round(k.v * 100);
      var cls = 'bar' + (k.wknd ? ' wknd' : '') + (k.raw === 0 ? ' zero' : '');
      koniunkturaHTML += '<div class="' + cls + '" style="height:' + Math.max(h, 3) + '%" title="Dzień ' + k.d + ': ' + k.raw + '"></div>';
      daysHTML += '<span>' + (k.d % 2 === 1 ? k.d : '') + '</span>';
    }

    /* nowe opinie */
    var opinieHTML = '';
    var nowe = [];
    for (i = 0; i < D.opinie_google.length; i++) if (D.opinie_google[i].nowa) nowe.push(D.opinie_google[i]);
    if (nowe.length > 0) {
      opinieHTML += '<div class="kon-title" style="margin:14px 0 8px">Nowe opinie Google (od ' + (D.opinie_poprzedni_raport || 'poprzedniego raportu') + ')</div>';
      for (i = 0; i < nowe.length; i++) {
        opinieHTML += '<div class="splash-op"><div class="m">' + nowe[i].data + ' · ' + nowe[i].nazwa + ' · opiekun: ' + nowe[i].handlowiec + '</div><div>' + nowe[i].tresc + '</div></div>';
      }
    } else {
      opinieHTML = '<div class="info-line">Brak nowych opinii Google od poprzedniego raportu.</div>';
    }

    var html = '';
    html += '<div class="splash-inner">';
    html += '<h1>Dzień dobry, GAZDA Katowice 👋</h1>';
    html += '<div class="splash-date">Stan na ' + D.meta.data_raportu_pl + ' · upływ miesiąca ' + Math.round(c.uplyw * 100) + '%</div>';
    html += '<div class="kon-title">Realizacja AAK — lipiec</div>';
    html += '<div class="pbar"><div class="fill ' + fillCls + '" style="width:' + Math.min(pct, 100) + '%"></div><div class="txt">' + c.wykonanie_realne + ' / ' + c.cel_zespolowy + ' &nbsp;(' + pct + '%)</div></div>';
    html += '<div class="splash-grid">';
    html += '<div class="stat hl"><div class="lbl">Zamówienia AEK</div><div class="val">+' + aekPlus + '</div><div class="note">suma przyrostów</div></div>';
    html += '<div class="stat"><div class="lbl">Magazyn</div><div class="val">' + D.magazyn.razem + '</div><div class="note">CU ' + D.magazyn.klienc + ' · DE ' + D.magazyn.wolne + '</div></div>';
    html += '<div class="stat"><div class="lbl">Przeterminowane 120d+</div><div class="val" style="color:var(--bad)">' + przet120 + '</div><div class="note">wg age RTT</div></div>';
    var tiNow = D.trade_in_crm.aktywny ? D.trade_in_crm.biezacy.wygrane.length : 0;
    var tiPrev = D.trade_in_crm.aktywny ? D.trade_in_crm.poprzedni.wygrane.length : 0;
    var opinieMc = 0;
    for (i = 0; i < D.kpi_handlowcy.length; i++) opinieMc += D.kpi_handlowcy[i].opinie;
    html += '<div class="stat"><div class="lbl">Trade-in odkupy</div><div class="val">' + tiNow + '</div><div class="note">czerwiec: ' + tiPrev + '</div></div>';
    html += '<div class="stat"><div class="lbl">Opinie Google</div><div class="val">' + opinieMc + '</div><div class="note">w lipcu (cel 5/os.)</div></div>';
    html += '</div>';
    html += '<div class="leaders">';
    html += '<div class="leader"><div class="kon-title">Lider AAK</div><div class="who">' + liderAAK + '</div><div class="res">' + maxA + ' szt.</div></div>';
    html += '<div class="leader"><div class="kon-title">Lider AEK</div><div class="who">' + liderAEK + '</div><div class="res">+' + maxE + ' zamówień</div></div>';
    html += '</div>';
    html += '<div class="kon-wrap"><div class="kon-title">Koniunktura dzienna — lipiec (oferty + klienci + traffic z CRM; weekendy ciemne)</div>';
    html += '<div class="kon">' + koniunkturaHTML + '</div><div class="kon-days">' + daysHTML + '</div></div>';
    html += opinieHTML;
    html += '<button class="splash-btn" id="splash-go">Przejdź do dashboardu →</button>';
    html += '</div>';

    var overlay = document.createElement('div');
    overlay.id = 'splash';
    overlay.innerHTML = html;
    document.body.appendChild(overlay);
    document.getElementById('splash-go').addEventListener('click', function () {
      overlay.remove();
    });
  }

  document.getElementById('pwd-btn').addEventListener('click', tryLogin);
  document.getElementById('pwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryLogin(); });

  if (store.get(SKEY) === PASS_HASH) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', enter);
    } else {
      enter();
    }
  }
})();
</script>

function minibar(v, max, cls, w = 70) {
  const px = max > 0 ? Math.max(2, Math.round(v / max * w)) : 2;
  return `<span class="minibar ${cls || ''}" style="width:${px}px"></span>`;
}
function statusBadge(st) {
  if (st === 'flota') return '<span class="badge dim">cel flotowy</span>';
  if (st === 'good') return '<span class="badge good">na kursie</span>';
  if (st === 'mid') return '<span class="badge warn">do nadrobienia</span>';
  return '<span class="badge bad">ryzyko</span>';
}
function tbl(head, rowsHtml, minw) {
  return `<div class="table-wrap"><div class="table-scroll"><table${minw ? ` style="min-width:${minw}px"` : ''}><thead><tr>${head}</tr></thead><tbody>${rowsHtml}</tbody></table></div></div>`;
}

function renderApp() {
  $('hdr-date').textContent = 'Stan na ' + DATA.meta.data_raportu_pl;
  $('foot').textContent = 'Źródło: ' + DATA.meta.zrodlo + ' · Dashboard wewnętrzny — nie udostępniać poza zespół.';
  const nav = $('main-tabs');
  nav.innerHTML = TABS.map(t => `<button class="tab${t.id === curTab ? ' active' : ''}" data-t="${t.id}">${t.label}</button>`).join('');
  nav.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { curTab = b.dataset.t; curSub = 0; renderApp(); }));
  const t = TABS.find(x => x.id === curTab);
  const sn = $('sub-tabs');
  if (t.subs.length) {
    sn.innerHTML = t.subs.map((s, i) => `<button class="subtab${i === curSub ? ' active' : ''}" data-i="${i}">${s}</button>`).join('');
    sn.querySelectorAll('.subtab').forEach(b => b.addEventListener('click', () => { curSub = parseInt(b.dataset.i, 10); renderApp(); }));
    sn.classList.remove('hidden');
  } else { sn.innerHTML = ''; sn.classList.add('hidden'); }
  const c = $('content');
  c.innerHTML = '';
  if (curTab === 'cele') renderCele(c);
  else if (curTab === 'handlowcy') renderHandlowcy(c);
  else if (curTab === 'stock') renderStock(c);
  else if (curTab === 'tradein') renderTradeIn(c);
  else renderProdukcja(c);
}
window.renderApp = renderApp;

/* ===================== 1. CELE I ZADANIA ===================== */

      const r = DATA.realizacja.razem, dt = DATA.realizacja.detal;
      wrap.innerHTML = `<div class="card"><h3>Prognoza / widget AAK — detal</h3>
        <div class="kpi-tiles">

/* --- Grafik --- */
function renderGrafik(root) {
  const wrap = document.createElement('div');
  const g = DATA.grafik[grafikMonth];
  let head = '<th>Handlowiec</th>';
  for (let d = 1; d <= g.dni; d++) {
    const wd = g.weekdays[String(d)];
    const hol = g.holidays[String(d)];
    head += `<th class="${hol ? 'hol' : (wd >= 5 ? 'wknd' : '')}">${d}</th>`;
  }
  let rows = '';
  if (g.handlowcy.length === 0) rows = `<tr><td colspan="${g.dni + 1}" class="empty">Grafik na ${g.mc_label} — do uzupełnienia</td></tr>`;
  g.handlowcy.forEach(h => {
    rows += `<tr><td>${esc(h.short)}</td>`;
    for (let d = 1; d <= g.dni; d++) {
      const v = h.days[d - 1] || '';
      const wd = g.weekdays[String(d)];
      const hol = g.holidays[String(d)];
      const cls = (hol ? 'hol' : (wd >= 5 ? 'wknd' : '')) + (v === 'U' ? ' g-U' : v === 'Z' ? ' g-Z' : v === 'S' ? ' g-S' : '');
      rows += `<td class="${cls.trim()}">${esc(v)}</td>`;
    }
    rows += '</tr>';
  });
  let urlopy = '';
  if (g.plan_urlopowy.length) {
    urlopy = '<div class="card"><h3>Plan urlopowy — ' + esc(g.mc_label) + '</h3>' +
      tbl('<th>Od</th><th>Do</th><th>Kto</th><th>Typ</th>', g.plan_urlopowy.map(u => `<tr><td>${u.d_od}.${String(g.mc).padStart(2, '0')}</td><td>${u.d_do}.${String(g.mc).padStart(2, '0')}</td><td>${esc(u.kto_full)}</td><td><span class="badge warn">${esc(u.typ)}</span></td></tr>`).join('')) + '</div>';
  } else {
    urlopy = '<div class="desc">Plan urlopowy: brak wpisów dla ' + esc(g.mc_label) + '.</div>';
  }
  wrap.innerHTML = `<div class="toggle">
      <button data-m="aktualny" class="${grafikMonth === 'aktualny' ? 'active' : ''}">${esc(DATA.grafik.aktualny.mc_label)}</button>
      <button data-m="nastepny" class="${grafikMonth === 'nastepny' ? 'active' : ''}">${esc(DATA.grafik.nastepny.mc_label)}</button></div>
    <div class="card"><h3>Grafik godzin — ${esc(g.mc_label)}</h3>
    <div class="desc">U = urlop · Z = L4 · S = szkolenie · liczba = godziny · puste = wolne. Grafik uzupełniany ręcznie przy aktualizacji.</div>
    <div class="table-wrap"><div class="table-scroll"><table class="grafik-table" style="min-width:${g.dni * 26 + 120}px"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div></div></div>${urlopy}`;
  wrap.querySelectorAll('.toggle button').forEach(b => b.addEventListener('click', () => { grafikMonth = b.dataset.m; renderApp(); }));
  root.appendChild(wrap);
}

      const wrap = document.createElement('div');
      const mk = (arr) => arr.length
        ? tbl('<th>Data</th><th>Model</th><th>VIN</th><th>Typ</th><th>Handlowiec</th>',
          arr.map(r => `<tr><td>${esc(r.data)}</td><td>${esc(r.model)}</td><td class="mono">${esc(r.vin)}</td><td><span class="badge ${r.typ === 'CU' ? 'blue' : 'dim'}">${r.typ}</span></td><td>${esc(r.sprzedawca) || '—'}</td></tr>`).join(''), 560)
        : '<div class="empty">Brak dostaw w oknie 7 dni</div>';
      wrap.innerHTML = `<div class="desc">Okno: ostatnie 7 dni (od ${esc(DATA.dostawy.cutoff)})</div>
        <div class="card"><h3>Przyjęcia na VGP (PZ) <span class="badge blue">${DATA.dostawy.vgp.length}</span></h3>${mk(DATA.dostawy.vgp)}</div>
        <div class="card"><h3>Wydania do dealera (AAH) <span class="badge good">${DATA.dostawy.aah.length}</span></h3>${mk(DATA.dostawy.aah)}</div>`;
      root.appendChild(wrap);
    }
  } else if (curSub === 3) {
    {
      const wrap = document.createElement('div');
      const rows = DATA.prognoza.map(p => `<tr${p.mc === 'brak' ? ' style="color:var(--dim)"' : ''}>
        <td><b>${fmtMc(p.mc)}</b></td><td class="num">${p.cu}</td><td class="num">${p.de}</td><td class="num"><b style="color:#e8eef7">${p.razem}</b></td></tr>`).join('');
      const sum = DATA.prognoza.reduce((a, p) => ({ cu: a.cu + p.cu, de: a.de + p.de }), { cu: 0, de: 0 });
      let hh = '<th>Handlowiec</th>' + DATA.prognoza_mies.map(m => `<th class="num">${fmtMc(m).split(' ')[0]}</th>`).join('') + '<th class="num">Razem</th>';
      const hrows = DATA.prognoza_handlowcy.map(h => `<tr><td>${esc(h.name)}</td>` + DATA.prognoza_mies.map(m => `<td class="num">${h[m] || ''}</td>`).join('') + `<td class="num"><b style="color:#e8eef7">${h.razem}</b></td></tr>`).join('');
      wrap.innerHTML = `<div class="card"><h3>Prognoza dostaw — pipeline wg ETA</h3>
          ${tbl('<th>Miesiąc ETA</th><th class="num">CU</th><th class="num">DE</th><th class="num">Razem</th>',
        rows + `<tr class="sum"><td>Razem pipeline</td><td class="num">${sum.cu}</td><td class="num">${sum.de}</td><td class="num">${sum.cu + sum.de}</td></tr>`)}</div>
        <div class="card"><h3>Pipeline CU per handlowiec</h3>
          ${tbl(hh, hrows, 640)}</div>`;
      root.appendChild(wrap);
    }
  } else if (curSub === 4) {
    root.innerHTML = DATA.push.length
      ? ''
      : '<div class="banner">Lista <b>Push / OrderList</b> nie występuje w raporcie zbiorczym — auta push z komentarzami AAK6/AAK6X pojawią się po dodaniu ich do obiektu <span class="mono">DATA.push</span> przy aktualizacji.</div>';
  } else {
    root.innerHTML = '<div class="banner">Auta <b>funkcyjne</b> — w bieżącym raporcie brak aut o statusie FUNKCYJNY na magazynie. Sekcja zapełni się automatycznie, gdy takie auta pojawią się w danych.</div>';
  }
}

/* ===================== 4. TRADE-IN CRM ===================== */
function renderTradeIn(root) {
  const t = DATA.trade_in_crm;
  if (!t.aktywny) {
    root.innerHTML = `<div class="banner" style="text-align:center;padding:28px">
      <div style="font-size:16px;font-weight:700;color:#e8eef7;margin-bottom:6px">Moduł Trade-in CRM</div>
      Ruszy od <b>${esc(t.start_label || 'nowego miesiąca')}</b>.</div>`;
    return;
  }
  const wygTbl = (arr) => arr.length
    ? tbl('<th>Data</th><th>Klient</th><th>Pojazd</th><th>VIN</th><th>Handlowiec</th>',
      arr.map(w => `<tr class="hl-green"><td>${esc(w.data)}</td><td>${esc(w.klient || '')}</td><td>${esc(w.pojazd)}</td><td class="mono">${esc(w.vin)}</td><td>${esc(w.handlowiec)}</td></tr>`).join(''), 620)
    : '<div class="empty">Brak odkupów (status „Wygrany") utworzonych w tym miesiącu</div>';
  const rkTbl = (arr) => arr.length
    ? tbl('<th>Handlowiec</th><th class="num">Przekazane</th><th class="num">Odkupione</th><th class="num">Konwersja</th>',
      arr.map(r => `<tr><td>${esc(r.name)}</td><td class="num">${r.przekazane}</td><td class="num"><b style="color:#e8eef7">${r.odkupione}</b></td><td class="num">${r.konwersja}% ${minibar(r.konwersja, 100, r.konwersja >= 30 ? 'good' : '', 60)}</td></tr>`).join(''))
    : '<div class="empty">Brak przekazanych szans utworzonych w tym miesiącu</div>';
  const sumWyg = (m) => m.ranking.reduce((a, r) => a + r.odkupione, 0);
  const cur = t.biezacy, prev = t.poprzedni;
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="banner">Każdy miesiąc liczony osobno — <b>szanse i odkupy przypisane są do miesiąca, w którym lead został utworzony</b> w CRM, bez sumowania z poprzednimi okresami. Tylko zespół Volkswagen (salon VW Katowice).</div>
    <div class="kpi-tiles">
      <div class="tile"><div class="lbl">Szanse — ${esc(cur.label)}</div><div class="val" style="color:var(--accent)">${cur.total_leads}</div></div>
      <div class="tile"><div class="lbl">Odkupy — ${esc(cur.label)}</div><div class="val">${cur.wygrane.length}</div></div>
      <div class="tile"><div class="lbl">Szanse — ${esc(prev.label)}</div><div class="val">${prev.total_leads}</div></div>
      <div class="tile"><div class="lbl">Konwersja zespołu — ${esc(prev.label)}</div><div class="val">${prev.total_leads ? Math.round(sumWyg(prev) / prev.total_leads * 100) : 0}<small>%</small></div></div>
    </div>
    <div class="card"><h3>Odkupione (Wygrany) — ${esc(cur.label)}</h3>${wygTbl(cur.wygrane)}</div>
    <div class="card"><h3>Ranking — ${esc(cur.label)} <span class="badge dim">${cur.total_leads} szans</span></h3>${rkTbl(cur.ranking)}</div>
    <div class="card"><h3>Odkupione (Wygrany) — ${esc(prev.label)}</h3>${wygTbl(prev.wygrane)}</div>
    <div class="card"><h3>Ranking — ${esc(prev.label)} <span class="badge dim">${prev.total_leads} szans</span></h3>${rkTbl(prev.ranking)}</div>`;
  root.appendChild(wrap);
}

/* ===================== 5. INFORMACJA PRODUKCYJNA ===================== */
function renderProdukcja(root) {
  const keys = ['komunikaty', 'przerwy', 'kalendarz', 'restrykcje'];
  const labels = ['Komunikaty', 'Przerwy produkcyjne', 'Kalendarz', 'Restrykcje'];
  const arr = DATA.produkcja[keys[curSub]] || [];
  if (arr.length === 0) {
    root.innerHTML = `<div class="banner">Sekcja „${labels[curSub]}" zaciągana jest z bieżącej <b>Informacji Handlowej (${esc(DATA.meta.ih_numer)})</b> —
      raport zbiorczy VGP nie zawiera treści IH. Wrzuć najnowszy załącznik „Informacja produkcyjna" do folderu Pobrane — zostanie wczytany przy kolejnej aktualizacji.</div>`;
    return;
  }
  root.innerHTML = arr.map(k => {
    let body = '';
    if (k.tabela && k.tabela.length) {
      const head = k.tabela[0].map(c => `<th${/^(Model|Kod)$/i.test(c) ? '' : ' class="num"'}>${esc(c)}</th>`).join('');
      const body2 = k.tabela.slice(1).map(r => '<tr>' + r.map((c, ci) => `<td${ci ? ' class="num"' : ''}>${esc(c || '—')}</td>`).join('') + '</tr>').join('');
      body = tbl(head, body2);
    }
    if (k.tresc) body += `<div${k.pre ? ' style="white-space:pre-wrap;line-height:1.55"' : ''}>${esc(k.tresc)}</div>`;
    return `<div class="card"><h3>${esc(k.tytul)}</h3><div class="desc" style="margin:0 0 8px">${esc(k.data || '')}</div>${body}</div>`;
  }).join('');
}
</script>
